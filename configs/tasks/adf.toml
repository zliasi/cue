# adf (amsterdam modeling suite). set [paths] for your cluster.
# usage: cue adf job.ams -n 8
# the ams driver runs the engine named in the input's Engine block (ADF,
# BAND, DFTB, ...), so this config covers the whole suite. results
# stream to <outdir>/<stem>.out; the binary ams.results directory ends
# up in the archive.

[task]
extensions = [".ams", ".in"]

[resources]
ntasks = 8
cpus = 1
memory_gb = 16

[paths]
ams_home = "/path/to/ams"
scm_license = "/path/to/license.txt"

[environment]
setup = """
module purge
export AMSHOME="{ams_home}"
export AMSBIN="$AMSHOME/bin"
export AMSRESOURCES="$AMSHOME/atomicdata"
export SCMLICENSE="{scm_license}"
# keep the suite's own temporary files on the node-local scratch too.
export SCM_TMPDIR="$scratch"
# mpi ranks for the ams startup script.
export NSCM={ntasks}
"""

[execution]
command = '"$AMSBIN/ams" < "{input}" > "{output_dir}/{stem}.out"'
scratch = true
archive = true
